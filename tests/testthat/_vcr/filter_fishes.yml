        of Life","alias":"COL26.10 XR","description":"The Catalogue of Life is building
        a comprehensive catalogue of all known species on Earth. To achieve it, its
        assembly process comprises two major phases.\nThe first phase brings together
        information curated and verified by experts specifically for the Catalogue
        of Life at a global level. \nThe result of this phase, the Base Release, is
        a dataset published monthly and annually. \nCurrent and historical versions
        are available for use and consultation on [Catalogue of Life’s website](https://www.catalogueoflife.org/)
        as well as its infrastructure,\n[ChecklistBank](https://www.checklistbank.org/).\n\nThe
        second phase builds on the Base Release 2026-10-14 (COL26.10) by programmatically
        integrating additional information from 62498 overlapping taxonomic and nomenclatural\nsources
        - global, regional, national and management data sources (checklists), as
        well as from digitised literature available through ChecklistBank.\nThe result
        of this phase, the Extended Release (COL XR), is a separate dataset published
        monthly and annually.\n\nThe Extended Release is the current taxonomic framework
        used by [GBIF](https://www.gbif.org/). It addresses several gaps in the Base
        Release and enriches \nexisting names with additional information such as
        authorships, references and vernacular names. It also incorporates molecular
        data, including barcode index numbers \nand operational taxon units. Higher-level
        taxonomy is added only for selected groups with significant gaps.\nThe additional
        information included in COL XR is easily identified on the Catalogue of Life
        website using the XR icon. When downloading the dataset, or subsets of it,
        \nthe ''merged'' field can be used to distinguish integrated information from
        content originating in the Base Release. The original content contributed
        through the Catalogue of Life Base Release\nis preserved, while additional
        information is integrated alongside it.\n\nUsers interested in the expert-curated
        source catalogue without additional programmatic integrations should consult
        the Catalogue of Life Base Release.\nThis enhanced process is continuously
        evolving and undergoes ongoing quality-control checks by COL editors and the
        wider community.\nDue to the programmatic nature of COL XR, as well as taxonomic
        and nomenclatural differences among the data sources used, some issues may
        arise.\nUsers are encouraged to report suspected issues through the [COL’s
        data GitHub repository](https://github.com/CatalogueOfLife/data/issues/new?template=xcol-content-feedback.md).
        \nWe will do our best to resolve reported issues as soon as possible.","issued":"2026-10-16","version":"2026-10-16
